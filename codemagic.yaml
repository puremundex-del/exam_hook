workflows:
  android-apk:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      vars:
        # This will be injected from Codemagic Secrets
        GEMINI_API_KEY: $GEMINI_API_KEY 
    scripts:
      - name: Find project root
        script: |
          PROJECT_DIR=$(find $CM_BUILD_DIR -name pubspec.yaml -exec dirname {} \; | head -n 1)
          echo "Found project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $CM_ENV
      
      - name: Flutter doctor
        working_directory: $PROJECT_DIR
        script: flutter doctor -v
        
      - name: Get Flutter packages
        working_directory: $PROJECT_DIR
        script: flutter pub get
        
      - name: Build APK with API Key
        working_directory: $PROJECT_DIR
        script: |
          flutter build apk --release \
          --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY \
          --split-per-abi # gives you 3 smaller APKs
          
    artifacts:
      - '**/build/app/outputs/flutter-apk/*.apk'