workflows:
  android-apk:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Find and enter project root
        script: |
          cd $CM_BUILD_DIR
          echo "Current dir: $(pwd)"
          echo "Files here:"
          ls -la
          # Find folder with pubspec.yaml
          PROJECT_DIR=$(find . -name pubspec.yaml -exec dirname {} \; | head -n 1)
          echo "Found pubspec in: $PROJECT_DIR"
          cd $PROJECT_DIR
          echo "Now in: $(pwd)"
      - name: Flutter doctor
        script: |
          PROJECT_DIR=$(find . -name pubspec.yaml -exec dirname {} \; | head -n 1)
          cd $PROJECT_DIR && flutter doctor -v
      - name: Get Flutter packages
        script: |
          PROJECT_DIR=$(find . -name pubspec.yaml -exec dirname {} \; | head -n 1)
          cd $PROJECT_DIR && flutter pub get
      - name: Build APK
        script: |
          PROJECT_DIR=$(find . -name pubspec.yaml -exec dirname {} \; | head -n 1)
          cd $PROJECT_DIR && flutter build apk --release
    artifacts:
      - '**/build/app/outputs/flutter-apk/*.apk'
